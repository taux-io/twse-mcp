[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twse-mcp"
version = "0.1.0"
description = "MCP server for the Taiwan Stock Exchange (TWSE) OpenAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "twse", "taiwan", "stock", "etf", "opendata"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
twse-mcp = "twse_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["twse_mcp"]
