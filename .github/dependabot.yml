# 版本更新（安全更新是另外在 repo 設定裡開的，不靠這份檔案）。
# 每週一次，minor/patch 併成一個 PR，避免一次湧進一堆。
# PR 一樣要過 main 的分支保護：required check 是 test（見 AGENTS.md）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # agents@0.31.0 的 peerOptional 只接受 server@2.3.1，升到 2.4.0 會讓 npm clean-install
    # 報 ERESOLVE（見 #197、#199）。等 agents 發新版放寬 peer 範圍後移除這段，
    # 並把 package.json 的 server 版本跟著升上去。
    ignore:
      - dependency-name: "@modelcontextprotocol/server"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
