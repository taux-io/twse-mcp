# 版本更新（安全更新是另外在 repo 設定裡開的，不靠這份檔案）。
# 每週一次，minor/patch 併成一個 PR，避免一次湧進一堆。
# PR 一樣要過 main 的分支保護：required check 是 test（見 AGENTS.md）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # agents 的 peerOptional 把 server 釘在一個精確版本（agents@0.32.0 釘 server@2.4.0，
    # 之前 0.31.0 釘 2.3.1）。Dependabot 單獨升 server 會讓 npm clean-install 報 ERESOLVE
    # （見 #197、#199），所以不讓它開 server 的 PR。
    #
    # 代價：server 處理所有未認證的輸入，卻不會有版本更新的提醒。agents 的升版 PR 要手動把
    # package.json 的 server 一起升到新版 agents 的 peer 指定的版本（做法見 AGENTS.md
    # 的「依賴升級」）。等 agents 把 peer 放寬成範圍，再移除這段。
    ignore:
      - dependency-name: "@modelcontextprotocol/server"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
