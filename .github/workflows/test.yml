name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 測試完全離線（stub 掉出站 fetch），CI 不需要連證交所
      - run: npm test
      # 型別/設定檢查：確認 Worker 能 bundle，壞掉的部署設定在合併前就擋下
      - run: npm run dry-run
