# 打 `v*` tag 時，把 `server.json` 重新發布到官方 MCP Registry。
#
# 這支不建置、不發 npm 套件——本專案是 remote server，registry 條目只有 `remotes`
# 指向線上端點，沒有可安裝的套件（npm 上的 `twse-mcp` 是別人的，與本專案無關）。
# 所以這裡唯一的工作是把 server.json 送上去。
#
# 用 OIDC 而非 PAT：不需要任何長期 secret，`id-token: write` 換來的是一次性的憑證。
# 官方文件的 PAT 版本要求把 token 放進受保護的 Environment，那對這個規模的專案是
# 沒必要的維護負擔。
name: publish to mcp registry

on:
  push:
    tags: ["v*"]
  # 手動重發：registry 標示為 preview，官方明說可能有資料重置，
  # 屆時不必為了重發而硬打一個新 tag。
  workflow_dispatch:

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # OIDC 換憑證用。顯式寫出 contents: read，是為了不受未來組織層級預設值變動影響
      # ——與 test.yml 同樣的理由。
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # server.json 的 version 要跟 tag 一致，否則 registry 上會出現一個與 tag
      # 對不起來的版本。以 tag 為準覆寫，而不是要求人記得先改檔案。
      - name: sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "server.json version -> $VERSION"

      # 固定版本 + 驗 digest，而不是 `latest | tar xz`。
      #
      # 這一步握有 `id-token: write`，換到的憑證能改寫本專案在官方 MCP Registry 的
      # 條目，而該條目的 `remotes[].url` 正是所有 registry 安裝指向的端點。把未固定、
      # 未驗證的二進位放進這個位置，等於讓上游的一次發布事故就能靜默改掉所有人的連線
      # 目標。稽核 run-6 的 H-1 就是這件事。
      #
      # 為什麼是硬編 digest 而不是抓 checksums 檔：能替換產物的人也能替換 checksums
      # 檔，那只擋得住傳輸損毀，擋不住惡意替換。digest 寫在版控裡，改動看得見。
      # 為什麼不是 `gh attestation verify`：實測該 repo 沒有 GitHub attestation
      # （API 回 404）；`.sigstore.json` 要 cosign，而裝 cosign 又是另一個未固定的
      # 下載——循環回原本的問題。
      #
      # 升版步驟：改 VERSION，然後從官方 checksums 取新的 digest 填進 SHA256——
      #   curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/vX.Y.Z/registry_X.Y.Z_checksums.txt \
      #     | grep -E '  mcp-publisher_linux_amd64\.tar\.gz$'
      # runner 固定是 ubuntu-latest（x86_64），所以只釘 linux_amd64 這一個平台。
      - name: install mcp-publisher (pinned + verified)
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          ASSET="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$ASSET" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/${ASSET}"
          echo "${SHA256}  ${ASSET}" | sha256sum -c -
          tar xzf "$ASSET" mcp-publisher
          rm -f "$ASSET"

      # 先驗證再登入：schema 錯誤不該浪費一次認證，也讓失敗訊息停在看得懂的地方。
      - name: validate server.json
        run: ./mcp-publisher validate

      - name: authenticate
        run: ./mcp-publisher login github-oidc

      - name: publish
        run: ./mcp-publisher publish
