name: smoke

# 在 runner 上起 wrangler dev，對每一支工具發一個真實查詢（scripts/smoke.mjs）。
# 單元測試跑在手寫 fixture 上，抓不到「上游真實資料不符 outputSchema，整支工具失敗」；
# 每日上游健檢只看上游，不呼叫我們的工具。這支補兩者之間的缺口。
#
# 打本機而不是正式環境：程式與 Workers 執行期相同、也真的抓上游，但測試請求不會混進
# 正式環境的真實流量，也不產生用量費用。（#104 當時正式環境在免費方案，為了不消耗
# 10 ms CPU 的寬容額度；2026-10-31 已升級 Workers Paid，這個做法照舊。）
#
# - pull_request：合併前擋下會讓某支工具在真實資料上失敗的改動
# - schedule：上游資料每天變，程式沒變也可能開始失敗；失敗就開 issue
#
# 排程時另外對正式環境做存活檢查：工具清單、快捷指令與首頁，外加 modern 的 dataset.get
# 一次（共 9 個請求），其餘工具不呼叫。
# 本機測不到部署失敗、網域設定跑掉、正式環境跑的不是 main 這類問題。
#
# 排程時也比對官方 MCP Registry 上的條目（scripts/check-registry.mjs）：它的連線位址必須與
# repo 的 server.json 相同。發布憑證在 repo 這一側鎖不住，所以每天看一次結果。

on:
  pull_request:
  schedule:
    - cron: "7 2 * * *" # 每天 02:07 UTC（台北 10:07），在上游健檢（09:37）之後
  workflow_dispatch:

# 預設唯讀。要寫入的那個 job（report）自己宣告權限。
permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts

      - name: 起本機 wrangler dev
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx wrangler dev --port 8787 --test-scheduled > wrangler.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q "Ready on http://localhost:8787" wrangler.log && exit 0
            sleep 2
          done
          cat wrangler.log
          exit 1

      - name: 每支工具實測
        run: npm run smoke

      # 每日存檔的寫入路徑：觸發一次排程，確認本機 D1 真的寫進了一整天的上市股票。
      # 判斷與報告交給 archive-report.mjs：失敗時它寫 archive-report.md，開 issue 的 job 才看得到原因。
      # 前兩個指令失敗不中斷（|| true），讓腳本拿到狀態碼與列數後一次說清楚。
      - name: 每日存檔（本機 D1）
        run: |
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:8787/__scheduled?cron=30+22+*+*+*" || true)
          N=$(npx wrangler d1 execute twse-mcp-archive --local --json \
                --command "SELECT COUNT(*) AS n FROM daily_quotes" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].results[0].n))' || true)
          node scripts/archive-report.mjs "$STATUS" "$N" wrangler.log

      - name: 正式環境存活檢查
        if: always() && github.event_name != 'pull_request'
        env:
          SMOKE_LIST_ONLY: "1"
          SMOKE_ENDPOINT: https://twse-mcp.taux.io/mcp
          SMOKE_REPORT: prod-report.md
        run: node scripts/smoke.mjs

      - name: registry 條目沒有被改指到別處
        if: always() && github.event_name != 'pull_request'
        env:
          REGISTRY_REPORT: registry-report.md
        run: node scripts/check-registry.mjs

      - name: wrangler log（失敗時看）
        if: failure()
        run: tail -100 wrangler.log || true

      # 開 issue 的是另一個 job，沒有這個工作目錄，報告用 artifact 傳過去。
      - name: 保留報告給開 issue 的 job
        if: failure() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-reports
          path: |
            smoke-report.md
            archive-report.md
            prod-report.md
            registry-report.md
          if-no-files-found: ignore

  # 開 issue 需要 issues: write。上面的 job 在 PR 上會執行分支裡的程式，還跑整套 npm 相依，
  # 所以寫入權限不放在那裡：這個 job 不 checkout、不裝任何東西，只讀報告並呼叫 gh。
  # 用到的 action 釘到 commit SHA，理由與 publish-mcp.yml 相同。
  report:
    needs: smoke
    # failure() 一定要寫：只寫 needs.smoke.result 的話會被隱含的 success() 蓋掉，這個 job 永遠被跳過。
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # 腳本在產出報告前就掛掉時沒有 artifact，下一步有對應的說明文字。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: smoke-reports

      # 只有排程的失敗開 issue；PR 的失敗留在 PR 上看。作法與 upstream-health 相同：
      # 標籤先確保存在，查找綁作者與標籤，已存在就留言。
      - name: 排程失敗就開 issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "smoke: 工具在真實資料上失敗"
          LABEL: smoke
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${GITHUB_RUN_ID}"
          # 只串存在的檔案：archive-report.md 只有每日存檔失敗時才有，prod 與 registry 的報告在前面的步驟掛掉時也可能沒有。
          REPORT=$(for f in smoke-report.md archive-report.md prod-report.md registry-report.md; do
            if [ -f "$f" ]; then cat "$f"; echo; fi
          done)
          if [ -z "$REPORT" ]; then REPORT="（腳本沒有產出報告，請看 run 的 log）"; fi
          BODY=$(printf '%s\n' \
            "每日冒煙測試（本機 wrangler dev + 真實上游資料，加上正式環境存活檢查與 registry 條目比對）發現問題：" \
            "" \
            "$REPORT" \
            "" \
            "常見原因：上游資料多了程式沒預期的值，讓回應不符 outputSchema（SDK 會讓整個呼叫失敗）；或上游格式改變。先用 \`npm run smoke\` 在本機重現。正式環境那段失敗、本機通過時，看 Cloudflare 的部署與網域設定。registry 條目不一致而且不是自己發布的，視為條目被竄改：先重新發布正確的 server.json，再查是誰發布的。" \
            "" \
            "[查看這次 run](${RUN_URL})")
          gh label create "$LABEL" --description "Daily smoke test against real upstream data" --color D93F0B --force
          EXISTING=$(gh issue list --state open --author app/github-actions --label "$LABEL" \
            --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
