name: refresh catalog

# 證交所偶爾會新增／調整資料集與欄位。catalog 是建置期烘進 bundle 的靜態檔，
# 不會自己更新，所以每週重抓一次 swagger，有變動就備好分支並開 issue 通知。
# 同一趟也更新休市日副本（src/holidays.generated.json）：證交所的休市日表只列一個年度，要趁它還列著時存下來。
#
# 注意：本組織政策禁止 GitHub Actions 開 PR，所以這裡改成「推分支 + 開 issue
# （內含一鍵開 PR 的連結）」。若日後組織開放該權限，可改成直接 gh pr create。

on:
  schedule:
    - cron: "17 1 * * 1" # 每週一 01:17 UTC（台北時間 09:17）
  workflow_dispatch: # 也可手動觸發

# 預設唯讀。三個 job 的分工：
#   refresh         唯讀。跑 npm 工具鏈重抓 swagger、驗證，把新目錄交給下一個 job。
#   publish         contents: write、issues: write。只做 git push 與開 issue，不裝任何相依。
#   report-failure  issues: write。前兩個 job 任何一個失敗就開 issue。
# 寫入權限不放在跑 npm 工具鏈的 job：那裡執行的是幾百個套件的程式。
permissions:
  contents: read

# 兩次執行同時跑會互相 force-push，後者覆蓋前者。排隊而非取消，
# 因為每一次都代表證交所的一個真實狀態，不該被丟掉。
concurrency:
  group: refresh-catalog
  cancel-in-progress: false

env:
  # 這是機器人專用的暫存分支，每次執行都會 force-push 覆蓋。
  # 不要在這個分支上直接修東西——下次執行就沒了；要改請另開分支。
  BRANCH: chore/catalog-refresh
  CATALOG: src/catalog.generated.json
  # 本服務保存的休市日副本（見 AGENTS.md）。與目錄一起刷新、一起交給 publish。
  HOLIDAYS: src/holidays.generated.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # --ignore-scripts：與 test.yml 同理，本專案不需要相依套件的安裝腳本。
      - run: npm ci --ignore-scripts

      - name: 重抓證交所 swagger
        run: npm run refresh-catalog

      - name: 重抓休市日表
        run: npm run refresh-holidays

      # 兩個檔案任何一個有變動就往下走。摘要分兩段，各自只在那個檔案有變動時才寫。
      - name: 有變動嗎
        id: diff
        run: |
          if git diff --quiet "$CATALOG" "$HOLIDAYS"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "目錄與休市日副本都沒有變動，收工。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat "$CATALOG" "$HOLIDAYS"
            # commit 之前，HEAD 還是舊的檔案
            {
              if git diff --quiet "$CATALOG"; then
                echo "資料集目錄沒有變動。"
              else
                git show "HEAD:$CATALOG" > "$RUNNER_TEMP/catalog-old.json"
                node scripts/catalog-diff.mjs "$RUNNER_TEMP/catalog-old.json" "$CATALOG"
              fi
              if ! git diff --quiet "$HOLIDAYS"; then
                git show "HEAD:$HOLIDAYS" > "$RUNNER_TEMP/holidays-old.json"
                echo
                node scripts/refresh-holidays.mjs --diff "$RUNNER_TEMP/holidays-old.json" "$HOLIDAYS"
              fi
            } | tee "$RUNNER_TEMP/catalog-diff.md"
          fi

      # 推分支不會觸發既有的 tests workflow，所以在這裡就把驗證做完，
      # 確保通知維護者時，這份新 catalog 已經確定能用。
      #
      # 測試「有」用到真實目錄（server.ts 直接 import 它，改壞會紅），但覆蓋面
      # 只到少數幾個資料集；check-catalog 補的是整體性檢查——規模、結構、以及
      # snapshot.etf 依賴的資料集是否還在。
      - name: 健檢新的 catalog
        if: steps.diff.outputs.changed == 'true'
        run: npm run check-catalog

      - name: 驗證程式仍能建置與通過測試
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm test
          npm run dry-run

      # 驗證過的目錄與異動摘要交給 publish。兩個檔案放進同一個目錄再上傳，artifact 的結構才固定。
      - name: 交給 publish
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/handoff"
          cp "$CATALOG" "$RUNNER_TEMP/handoff/catalog.generated.json"
          cp "$HOLIDAYS" "$RUNNER_TEMP/handoff/holidays.generated.json"
          cp "$RUNNER_TEMP/catalog-diff.md" "$RUNNER_TEMP/handoff/catalog-diff.md"
      - uses: actions/upload-artifact@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          name: catalog-refresh
          path: ${{ runner.temp }}/handoff
          if-no-files-found: error

  # 只做兩件事：把上一個 job 驗證過的目錄檔推上機器人分支，然後開 issue。
  # 不跑 npm、不執行 repo 裡的任何腳本；用到的 action 釘到 commit SHA（理由見 publish-mcp.yml）。
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: catalog-refresh
          path: ${{ runner.temp }}/handoff

      - name: 推上分支
        run: |
          # 只拿這兩個產生的檔案，其餘的工作目錄內容都來自這個 job 自己的 checkout。
          # 沒有變動的那一個複製過來內容相同，git add 不會把它算進 commit。
          cp "$RUNNER_TEMP/handoff/catalog.generated.json" "$CATALOG"
          cp "$RUNNER_TEMP/handoff/holidays.generated.json" "$HOLIDAYS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$CATALOG" "$HOLIDAYS"
          git commit -m "chore: refresh TWSE/TAIFEX catalog"
          # force：這是機器人專用的暫存分支，每次都以最新結果覆寫（見上方 env 註解）
          git push --force origin "$BRANCH"

      - name: 開 issue 通知（已存在就補一則留言）
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "catalog: 證交所目錄有變動待審"
          LABEL: catalog-drift
        run: |
          COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/main...${BRANCH}?expand=1"
          SUMMARY=$(cat "$RUNNER_TEMP/handoff/catalog-diff.md")
          BODY=$(printf '%s\n' \
            "每週自動刷新發現資料集目錄（\`${CATALOG}\`）或休市日副本（\`${HOLIDAYS}\`）有變動，已把新的檔案推到 \`${BRANCH}\`。" \
            "" \
            "**異動**（資料集 id 的 \`taifex/\` 前綴是期交所，其餘是證交所）：" \
            "" \
            "${SUMMARY}" \
            "" \
            "**已驗證**：catalog 健檢（規模、結構、snapshot.etf 依賴的資料集仍在）、" \
            "typecheck、測試（其中有數項直接對真實目錄與休市日副本斷言）、\`wrangler deploy --dry-run\` 全數通過。" \
            "" \
            "[點此開 PR 檢視 diff](${COMPARE})" \
            "" \
            "上面只列資料集與欄位名稱的增減；說明文字的改動看 diff。" \
            "欄位被移除時，先對照實際資料還有沒有那一欄——可能是 swagger 少寫，不是上游真的拿掉。" \
            "" \
            "⚠️ \`${BRANCH}\` 是機器人專用分支，每次執行都會被覆寫。要修改請另開分支，別直接推到它上面。" \
            "" \
            "_由 \`${GITHUB_WORKFLOW}\` 自動產生（run #${GITHUB_RUN_NUMBER}）_")
          # 只靠標題搜尋會撈到任何人開的同名 issue：外人只要先開一個佔位，
          # 通知就會被灌進他的討論串，而且 create 分支永遠不會執行 —— 等於把
          # 這個 workflow 存在的唯一告警靜音掉。所以再加上作者與標籤兩道過濾。
          # --force 是 create-or-update，標籤不存在時 gh issue create --label 會
          # 直接失敗（run: 跑在 bash -e 下會中斷整個 step），先確保它存在。
          gh label create "$LABEL" \
            --description "TWSE catalog drift alert" --color FBCA04 --force
          EXISTING=$(gh issue list --state open \
            --author app/github-actions \
            --label "$LABEL" \
            --search "$TITLE in:title" \
            --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi

  report-failure:
    needs: [refresh, publish]
    # failure() 一定要寫：沒有狀態函式的話會被隱含的 success() 蓋掉，這個 job 永遠被跳過。
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # 沒有這一步的話，執行失敗只會留下一個紅色的 run，不會有人看到——
      # 一週跑一次的排程沒人盯，等於整整一週沒有目錄漂移偵測而不自知。
      # 2026-08-03 就是這樣過去的（證交所回了 2xx + HTML，腳本掛掉，無人知曉）。
      - name: 執行失敗時開 issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "catalog: 每週刷新執行失敗"
          LABEL: catalog-refresh-failed
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(printf '%s\n' \
            "每週的 catalog 刷新執行失敗了，這代表**目錄漂移偵測目前是停擺的**——" \
            "在修好之前，證交所若新增／移除資料集或欄位，我們不會收到通知。" \
            "" \
            "[查看失敗的 run](${RUN_URL})" \
            "" \
            "最常見的原因是上游暫時回了非 JSON（證交所前面的 nginx 擋流量或維護時，" \
            "會用 2xx 狀態碼送出一張 HTML 錯誤頁）。腳本已內建三次退避重試，" \
            "所以連重試都失敗通常表示問題不是瞬時的。錯誤訊息會附上狀態碼、" \
            "content-type 與 body 開頭，先看那三項。" \
            "" \
            "確認上游恢復後，可用 workflow_dispatch 手動重跑，不必等下週一。" \
            "" \
            "_由 \`${GITHUB_WORKFLOW}\` 自動產生（run #${GITHUB_RUN_NUMBER}）_")
          # 與上一個步驟同樣的理由：標籤要先存在，且查找要綁作者與標籤，
          # 否則通知會被外人開的同名 issue 接走。
          gh label create "$LABEL" \
            --description "TWSE catalog refresh workflow failure" --color B60205 --force
          EXISTING=$(gh issue list --state open \
            --author app/github-actions \
            --label "$LABEL" \
            --search "$TITLE in:title" \
            --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
