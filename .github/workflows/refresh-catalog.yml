name: refresh catalog

# 證交所偶爾會新增／調整資料集與欄位。catalog 是建置期烘進 bundle 的靜態檔，
# 不會自己更新，所以每週重抓一次 swagger，有變動就備好分支並開 issue 通知。
#
# 注意：本組織政策禁止 GitHub Actions 開 PR，所以這裡改成「推分支 + 開 issue
# （內含一鍵開 PR 的連結）」。若日後組織開放該權限，可改成直接 gh pr create。

on:
  schedule:
    - cron: "17 1 * * 1" # 每週一 01:17 UTC（台北時間 09:17）
  workflow_dispatch: # 也可手動觸發

permissions:
  contents: write
  issues: write

# 兩次執行同時跑會互相 force-push，後者覆蓋前者。排隊而非取消，
# 因為每一次都代表證交所的一個真實狀態，不該被丟掉。
concurrency:
  group: refresh-catalog
  cancel-in-progress: false

env:
  # 這是機器人專用的暫存分支，每次執行都會 force-push 覆蓋。
  # 不要在這個分支上直接修東西——下次執行就沒了；要改請另開分支。
  BRANCH: chore/catalog-refresh
  CATALOG: src/catalog.generated.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: 重抓證交所 swagger
        run: npm run refresh-catalog

      - name: 有變動嗎
        id: diff
        run: |
          if git diff --quiet "$CATALOG"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "證交所目錄無變動，收工。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat "$CATALOG"
          fi

      # 推分支不會觸發既有的 tests workflow，所以在這裡就把驗證做完，
      # 確保通知維護者時，這份新 catalog 已經確定能用。
      #
      # 測試「有」用到真實目錄（server.ts 直接 import 它，改壞會紅），但覆蓋面
      # 只到少數幾個資料集；check-catalog 補的是整體性檢查——規模、結構、以及
      # twse_etf_snapshot 依賴的資料集是否還在。
      - name: 健檢新的 catalog
        if: steps.diff.outputs.changed == 'true'
        run: npm run check-catalog

      - name: 驗證程式仍能建置與通過測試
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm test
          npm run dry-run

      - name: 推上分支
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$CATALOG"
          git commit -m "chore: refresh TWSE catalog"
          # force：這是機器人專用的暫存分支，每次都以最新結果覆寫（見上方 env 註解）
          git push --force origin "$BRANCH"

      - name: 開 issue 通知（已存在就補一則留言）
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "catalog: 證交所目錄有變動待審"
          LABEL: catalog-drift
        run: |
          COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/main...${BRANCH}?expand=1"
          BODY=$(printf '%s\n' \
            "每週自動刷新發現證交所的 swagger 有變動，已把新的 \`${CATALOG}\` 推到 \`${BRANCH}\`。" \
            "" \
            "**已驗證**：catalog 健檢（規模、結構、twse_etf_snapshot 依賴的資料集仍在）、" \
            "typecheck、測試（其中有數項直接對真實目錄斷言）、\`wrangler deploy --dry-run\` 全數通過。" \
            "" \
            "[點此開 PR 檢視 diff](${COMPARE})" \
            "" \
            "diff 會顯示證交所新增／移除了哪些資料集或欄位——這就是我們把 catalog 簽入版控的用意。" \
            "" \
            "⚠️ \`${BRANCH}\` 是機器人專用分支，每次執行都會被覆寫。要修改請另開分支，別直接推到它上面。" \
            "" \
            "_由 \`${GITHUB_WORKFLOW}\` 自動產生（run #${GITHUB_RUN_NUMBER}）_")
          # 只靠標題搜尋會撈到任何人開的同名 issue：外人只要先開一個佔位，
          # 通知就會被灌進他的討論串，而且 create 分支永遠不會執行 —— 等於把
          # 這個 workflow 存在的唯一告警靜音掉。所以再加上作者與標籤兩道過濾。
          # --force 是 create-or-update，標籤不存在時 gh issue create --label 會
          # 直接失敗（run: 跑在 bash -e 下會中斷整個 step），先確保它存在。
          gh label create "$LABEL" \
            --description "TWSE catalog drift alert" --color FBCA04 --force
          EXISTING=$(gh issue list --state open \
            --author app/github-actions \
            --label "$LABEL" \
            --search "$TITLE in:title" \
            --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi

      # 沒有這一步的話，執行失敗只會留下一個紅色的 run，不會有人看到——
      # 一週跑一次的排程沒人盯，等於整整一週沒有目錄漂移偵測而不自知。
      # 2026-08-03 就是這樣過去的（證交所回了 2xx + HTML，腳本掛掉，無人知曉）。
      - name: 執行失敗時開 issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "catalog: 每週刷新執行失敗"
          LABEL: catalog-refresh-failed
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(printf '%s\n' \
            "每週的 catalog 刷新執行失敗了，這代表**目錄漂移偵測目前是停擺的**——" \
            "在修好之前，證交所若新增／移除資料集或欄位，我們不會收到通知。" \
            "" \
            "[查看失敗的 run](${RUN_URL})" \
            "" \
            "最常見的原因是上游暫時回了非 JSON（證交所前面的 nginx 擋流量或維護時，" \
            "會用 2xx 狀態碼送出一張 HTML 錯誤頁）。腳本已內建三次退避重試，" \
            "所以連重試都失敗通常表示問題不是瞬時的。錯誤訊息會附上狀態碼、" \
            "content-type 與 body 開頭，先看那三項。" \
            "" \
            "確認上游恢復後，可用 workflow_dispatch 手動重跑，不必等下週一。" \
            "" \
            "_由 \`${GITHUB_WORKFLOW}\` 自動產生（run #${GITHUB_RUN_NUMBER}）_")
          # 與上一個步驟同樣的理由：標籤要先存在，且查找要綁作者與標籤，
          # 否則通知會被外人開的同名 issue 接走。
          gh label create "$LABEL" \
            --description "TWSE catalog refresh workflow failure" --color B60205 --force
          EXISTING=$(gh issue list --state open \
            --author app/github-actions \
            --label "$LABEL" \
            --search "$TITLE in:title" \
            --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
